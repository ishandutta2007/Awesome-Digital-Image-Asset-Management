<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for soft glows -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 3.5s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashMove 20s linear infinite;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes pulsePill {
        0% { opacity: 0.85; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Strictly in Background) -->
  <g filter="url(#blurFilter)">
    <circle cx="200" cy="100" r="160" fill="url(#glowGrad1)" class="orb-1" />
    <circle cx="1020" cy="300" r="180" fill="url(#glowGrad2)" class="orb-2" />
    <circle cx="600" cy="380" r="130" fill="#0ea5e9" opacity="0.15" />
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Decorative Animated Flow / Dynamic Elements in Background -->
  <g opacity="0.35">
    <path class="wave-line" d="M -50,330 C 250,280 400,380 700,310 C 950,250 1100,340 1250,290" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="wave-line" d="M -50,360 C 280,310 450,400 750,340 C 1000,290 1150,370 1250,320" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Central Header Text Content (Guaranteed Foreground & Clear Hierarchy) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(600, 72)" text-anchor="middle">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="-115" cy="-1" r="5" fill="#38bdf8" />
      <text x="-100" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Digital Image &amp; Asset Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Enterprise DAM • Self-Hosted Photo Libraries • On-the-Fly Media Pipelines
    </text>

    <!-- Feature Badges / Highlights -->
    <g transform="translate(180, 240)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)" class="pulse-pill">
        <rect width="250" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="250" height="4" rx="2" fill="#38bdf8" />
        <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">🏢 Enterprise DAM</text>
        <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Governance, DRM &amp; Portals</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(295, 0)" class="pulse-pill">
        <rect width="250" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="250" height="4" rx="2" fill="#818cf8" />
        <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">🔒 Self-Hosted &amp; E2EE</text>
        <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Data Sovereignty &amp; Privacy</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(590, 0)" class="pulse-pill">
        <rect width="250" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="250" height="4" rx="2" fill="#c084fc" />
        <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">⚡ Real-Time Processing</text>
        <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">URL Transforms &amp; CDN</text>
      </g>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(600, 365)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        Updated March 2026 • Verified Pricing &amp; Benchmarks • 20+ Curated Solutions
      </text>
    </g>
  </g>
</svg>